[filters.terraform-init]
description = "Compact Terraform init output"
match_command = "^terraform\\s+init(\\s|$)"
strip_ansi = true
strip_lines_matching = [
  "^- Downloading",
  "^- Installing",
  "^- Installed",
  "^- Finding",
  "^- Reusing previous version",
  "^- Using previously-installed",
  "^\\s*$",
  "^Initializing provider",
  "^Initializing the backend",
  "^Initializing modules",
  "^Upgrading modules",
  "^Terraform has created a lock file",
  "^selections it made above",
  "^you run \"terraform init\" in the future",
  "^You may now begin working",
  "^any changes that are required",
  "^should now work",
  "^If you ever set or change modules",
  "^rerun this command to reinitialize",
  "^commands will detect it and remind you",
  "^Partial output is",
]
max_lines = 20
on_empty = "terraform init: ok"

[[tests.terraform-init]]
name = "keeps the success line, drops provider chatter and the epilogue"
input = """
Initializing the backend...
Initializing provider plugins...
- Finding hashicorp/aws versions matching "~> 5.0"...
- Installing hashicorp/aws v5.31.0...
- Installed hashicorp/aws v5.31.0 (signed by HashiCorp)
Terraform has created a lock file .terraform.lock.hcl to record the provider
selections it made above. Include this file in your version control repository so that Terraform can guarantee to make the same selections by default when
you run "terraform init" in the future.

Terraform has been successfully initialized!

You may now begin working with Terraform. Try running "terraform plan" to see
any changes that are required for your infrastructure. All Terraform commands
should now work.

If you ever set or change modules or backend configuration for Terraform,
rerun this command to reinitialize your working directory. If you forget, other
commands will detect it and remind you to do so if necessary.
"""
expected = "Terraform has been successfully initialized!"

[[tests.terraform-init]]
name = "errors pass through"
input = """
Initializing the backend...

Error: Failed to get existing workspaces: S3 bucket does not exist.
"""
expected = "Error: Failed to get existing workspaces: S3 bucket does not exist."
